# BinaryEye Callback Server Configuration

# Server Configuration
server.port=8080

# Bluetooth Configuration
# Set to true to enable Bluetooth server (requires native Bluetooth support)
bluetooth.enabled=false
bluetooth.server-name=BinaryEye-Receiver

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.binaryeyecallback=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
